# 2001: A Space Odyssey inspired Helix theme

# ─────────────────────────────
# Syntax
# ─────────────────────────────

"attribute" = "steel"

"type" = "text"
"type.builtin" = "text"
"type.enum" = "yellow"
"type.enum.variant" = "yellow"
"type.parameter" = "text"

"constructor" = "yellow"
"constant" = "yellow"
"constant.builtin" = "yellow"
"constant.builtin.boolean" = "yellow"
"constant.character" = "yellow"
"constant.character.escape" = "yellow"
"constant.numeric" = "yellow"

"string" = "yellow"
"string.regexp" = "yellow"
"string.special" = "yellow"
"string.special.path" = "yellow"
"string.special.url" = { fg = "yellow", modifiers = ["underlined"] }

"comment" = { fg = "subtle", modifiers = ["italic"] }
"comment.line.documentation" = "muted"
"comment.block.documentation" = "muted"

"variable" = "text"
"variable.parameter" = "text"
"variable.builtin" = "text"
"variable.other.member" = "text"

"label" = "text"
"namespace" = "text"

"punctuation" = "text"
"punctuation.delimiter" = "text"
"punctuation.bracket" = "text"
"punctuation.special" = "gold"

"keyword" = "gold"
"keyword.control" = "gold"
"keyword.control.conditional" = "gold"
"keyword.control.repeat" = "gold"
"keyword.control.return" = "gold"
"keyword.control.import" = "gold"
"keyword.control.exception" = "gold"
"keyword.storage" = "gold"
"keyword.storage.type" = "gold"
"keyword.storage.modifier" = "gold"
"keyword.operator" = "gold"
"keyword.function" = "gold"

"operator" = "text"

"function" = "text"
"function.method" = "text"
"function.builtin" = "text"
"function.macro" = "steel"

"special" = "orange"
"tag" = "text"

# Markup
"markup.heading" = { fg = "text", modifiers = ["bold"] }
"markup.bold" = { fg = "text", modifiers = ["bold"] }
"markup.italic" = { fg = "text", modifiers = ["italic"] }
"markup.list" = "muted"
"markup.quote" = "comment"
"markup.raw" = "yellow"
"markup.link.url" = { fg = "yellow", modifiers = ["underlined"] }
"markup.link.text" = "yellow"

# Diff / diagnostics
"diff.plus" = "amber"
"diff.delta" = "orange"
"diff.minus" = "red"

"warning" = "orange"
"error" = "red"
"info" = "steel-light"
"hint" = "muted"

"diagnostic.warning" = { underline = { color = "orange", style = "curl" } }
"diagnostic.error" = { underline = { color = "red", style = "curl" } }
"diagnostic.info" = { underline = { color = "steel-light", style = "curl" } }
"diagnostic.hint" = { underline = { color = "subtle", style = "curl" } }

# ─────────────────────────────
# UI
# ─────────────────────────────

"ui.background" = { fg = "text", bg = "background" }
"ui.text" = "text"
"ui.text.focus" = "bright-text"
"ui.text.inactive" = "muted"

"ui.linenr" = "muted"
"ui.linenr.selected" = "amber"

"ui.cursor" = { fg = "background", bg = "muted" }
"ui.cursor.primary" = { fg = "background", bg = "text" }
"ui.cursor.insert" = { fg = "background", bg = "orange" }
"ui.cursor.select" = { fg = "background", bg = "amber" }
"ui.cursor.match" = { fg = "background", bg = "header" }

"ui.selection" = { bg = "selection" }
"ui.selection.primary" = { bg = "selection" }

"ui.cursorline.primary" = { bg = "surface" }
"ui.cursorline.secondary" = { bg = "surface" }

"ui.gutter" = { bg = "background" }
"ui.gutter.selected" = { bg = "surface" }

# Important for panel-divider feeling
"ui.window" = "divider"
"ui.background.separator" = "divider"

# Top tab bar imitation
"ui.bufferline" = { fg = "muted", bg = "background" }
"ui.bufferline.background" = { bg = "background" }
"ui.bufferline.active" = { fg = "background", bg = "header" }

# Menus / popups
"ui.menu" = { fg = "text", bg = "surface" }
"ui.menu.selected" = { fg = "background", bg = "header" }
"ui.menu.scroll" = { fg = "muted", bg = "surface" }

"ui.popup" = { fg = "text", bg = "surface" }
"ui.popup.info" = { fg = "text", bg = "surface" }

# Bottom instrument strip
"ui.statusline" = { fg = "muted", bg = "surface" }
"ui.statusline.inactive" = { fg = "subtle", bg = "background" }
"ui.statusline.normal" = { fg = "background", bg = "header" }
"ui.statusline.insert" = { fg = "background", bg = "orange" }
"ui.statusline.select" = { fg = "background", bg = "amber" }

"ui.help" = { fg = "text", bg = "surface" }

"ui.highlight" = { bg = "surface" }

"ui.virtual" = "subtle"
"ui.virtual.ruler" = { bg = "surface" }
"ui.virtual.whitespace" = "subtle"
"ui.virtual.indent-guide" = "divider"
"ui.virtual.inlay-hint" = "muted"
"ui.virtual.jump-label" = { fg = "orange", modifiers = ["bold"] }

# ─────────────────────────────
# Palette
# ─────────────────────────────

[palette]
background   = "#000000" # base00
surface      = "#12120E" # base01
selection    = "#363125" # base0F

divider      = "#6A5730" # base03
panel        = "#554F38" # base02
header       = "#BCA874" # base0A

text         = "#DDC891" # base05
bright-text  = "#E6D7AC" # base06
muted        = "#887A4F" # base04
subtle       = "#6A5730" # base03
comment      = "#D04428" # base08

yellow       = "#E0B84A" # base0B
amber        = "#BCA874" # base0A
orange       = "#D47A18" # base09
red          = "#D04428" # base08
gold         = "#D99A2B" # base0E

steel        = "#788993" # base0D
steel-light  = "#82939B" # base0C
